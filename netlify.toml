# Netlify config — replaces vercel.json.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Read at runtime by api/og/index.js via fs, so not auto-traced.
  included_files = ["api/og/Geist-Regular.ttf"]
  # Copied as whole packages, not bundled: resvg ships a native binary, and
  # satori's require() was left unresolved by the bundler (502 on /api/og).
  external_node_modules = ["@resvg/resvg-js", "satori"]

# Social short links — temporary (302) so destinations can change later.
[[redirects]]
  from = "/ig"
  to = "https://www.finaiw.com/?utm_source=instagram&utm_medium=social&utm_campaign=bio_link"
  status = 302
  force = true

[[redirects]]
  from = "/story"
  to = "https://www.finaiw.com/?utm_source=instagram&utm_medium=social&utm_campaign=story"
  status = 302
  force = true

[[redirects]]
  from = "/fb"
  to = "https://www.finaiw.com/?utm_source=facebook&utm_medium=social&utm_campaign=bio_link"
  status = 302
  force = true

[[redirects]]
  from = "/pin"
  to = "https://www.finaiw.com/?utm_source=pinterest&utm_medium=social&utm_campaign=bio_link"
  status = 302
  force = true

[[redirects]]
  from = "/x"
  to = "https://www.finaiw.com/?utm_source=twitter&utm_medium=social&utm_campaign=bio_link"
  status = 302
  force = true

# Apex domain: serve ads.txt directly (AdSense checks it on the exact
# registered domain), redirect everything else to the www canonical host.
[[redirects]]
  from = "https://finaiw.com/ads.txt"
  to = "/ads.txt"
  status = 200
  force = true

[[redirects]]
  from = "https://finaiw.com/*"
  to = "https://www.finaiw.com/:splat"
  status = 301
  force = true

# SPA fallback for routes without a prerendered file (not forced, so real
# files and functions always win).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.googletagservices.com https://www.googletagmanager.com https://*.google.com https://*.googlesyndication.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://query1.finance.yahoo.com https://*.googlesyndication.com https://*.google.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://*.googlesyndication.com https://*.google.com https://*.adtrafficquality.google; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite emits content-hashed filenames, so these can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
